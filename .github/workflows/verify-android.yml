name: Verify Android exporter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve plugin dependencies
        run: flutter pub get

      - name: Run Dart unit tests
        run: flutter test

      - name: Create isolated Android test application
        run: |
          flutter create --platforms=android --org com.worddaily --project-name exporter_smoke /tmp/worddaily-exporter-smoke
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('/tmp/worddaily-exporter-smoke/pubspec.yaml')
          text = path.read_text()
          assert 'dependencies:\n' in text
          text = text.replace('dependencies:\n', 'dependencies:\n  worddaily_video_exporter:\n    path: ' + os.environ['GITHUB_WORKSPACE'] + '\n', 1)
          path.write_text(text)
          PY

      - name: Resolve smoke test dependencies
        working-directory: /tmp/worddaily-exporter-smoke
        run: flutter pub get

      - name: Compile Android debug APK
        working-directory: /tmp/worddaily-exporter-smoke
        run: flutter build apk --debug

      - name: Run native Kotlin unit tests
        working-directory: /tmp/worddaily-exporter-smoke/android
        run: ./gradlew :worddaily_video_exporter:testDebugUnitTest --stacktrace
