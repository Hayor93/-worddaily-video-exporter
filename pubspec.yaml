name: worddaily_video_exporter
description: Android MP4 export with a moving WordDaily watermark and a branded audio outro.
version: 0.2.0
publish_to: none
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.worddaily.worddaily_video_exporter
        pluginClass: WorddailyVideoExporterPlugin
